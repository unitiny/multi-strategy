name: Deploy to Server

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd /opt/multi-strategy
            git stash --include-untracked
            git pull origin master
            git stash drop 2>/dev/null || true
            docker manifest inspect ghcr.io/unitiny/multi-strategy:${{ github.sha }} >/dev/null
            IMAGE_TAG=${{ github.sha }} docker compose pull
            IMAGE_TAG=${{ github.sha }} docker compose run --rm --no-deps multi-strategy sh -lc 'echo "image sha=$APP_GIT_SHA"; test ! -e /app/data; grep -n "market_data" /app/core/engine.py; python -c "from core.engine import Engine; import dateparser; print(\"import check ok\")"'
            IMAGE_TAG=${{ github.sha }} docker compose up -d --force-recreate --remove-orphans
            docker exec multi-strategy sh -lc 'echo "running sha=$APP_GIT_SHA"; test ! -e /app/data; grep -n "market_data" /app/core/engine.py'
            docker image prune -f
